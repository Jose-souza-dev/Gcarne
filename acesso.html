<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Validar Acesso | Gcarnê</title>
    <link rel="stylesheet" href="css/desktop.css">
    <style>
        .access-container {
            max-width: 400px;
            margin: 100px auto;
            padding: 30px;
            background: white;
            border-radius: 12px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.1);
            text-align: center;
        }
        .access-container h2 { margin-bottom: 20px; color: #1a1a1a; }
        .access-container input {
            width: 100%;
            padding: 12px;
            margin-bottom: 20px;
            border: 2px solid #e0e0e0;
            border-radius: 8px;
            font-size: 18px;
            text-align: center;
            letter-spacing: 2px;
        }
        .btn-validate {
            background: #4ad111;
            color: white;
            border: none;
            padding: 12px 30px;
            border-radius: 8px;
            font-weight: 600;
            cursor: pointer;
            width: 100%;
        }
        .btn-validate:disabled { background: #ccc; }
        .support-link { margin-top: 20px; display: block; color: #069; text-decoration: none; font-size: 14px; }
    </style>
</head>
<body style="background: #f4f6f9; display: block;">
    <div class="access-container">
        <h2>Ative seu Acesso</h2>
        <p style="color: #666; margin-bottom: 20px;">Insira o código enviado após o pagamento.</p>

        <input type="text" id="access-code" placeholder="CÓDIGO-0000" maxlength="20">
        <button class="btn-validate" id="btn-validar">Ativar Agora</button>

        <a href="https://wa.me/SEU_NUMERO" class="support-link" target="_blank">Não tem um código? Falar com suporte</a>
        <br>
        <a href="#" id="btn-logout-acesso" style="color: red; font-size: 12px; text-decoration: none;">Sair da conta</a>
    </div>

    <!-- Firebase SDKs -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getFirestore, doc, getDoc, updateDoc } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyDl1xc8pNFKO0ntbwitBFN0wVM2qAHtaSU",
            authDomain: "authentic-32ad2.firebaseapp.com",
            projectId: "authentic-32ad2",
            storageBucket: "authentic-32ad2.firebasestorage.app",
            messagingSenderId: "889249025251",
            appId: "1:889249025251:web:2502a96379d529246c89d6"
        };

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);

        const btn = document.getElementById('btn-validar');
        const input = document.getElementById('access-code');

        btn.addEventListener('click', async () => {
            const code = input.value.trim().toUpperCase(); // Garante que será maiúsculo
            if (!code) return;

            btn.disabled = true;
            btn.innerText = "Validando...";
            console.log("Tentando validar código:", code);

            try {
                // Alterado para procurar na coleção "codigo" (singular)
                const docRef = doc(db, "codigo", code);
                const docSnap = await getDoc(docRef);

                if (docSnap.exists()) {
                    const data = docSnap.data();
                    console.log("Dados encontrados:", data);

                    if (data.ativo === false) {
                        alert("Este código já foi usado ou está expirado!");
                    } else {
                        localStorage.setItem('gcarne_access_token', 'valid_user');
                        alert("Acesso liberado com sucesso!");
                        window.location.href = "criar_carne.html";
                    }
                } else {
                    console.error("Documento não existe no Firestore!");
                    alert("Código não encontrado. Verifique se o ID do documento no Firestore é exatamente: " + code);
                }
            } catch (error) {
                console.error("Erro completo do Firebase:", error);
                alert("Erro técnico: " + error.message);
            } finally {
                btn.disabled = false;
                btn.innerText = "Ativar Agora";
            }
        });
    </script>
    <script type="module" src="js/auth-handler.js"></script>
</body>
</html>
